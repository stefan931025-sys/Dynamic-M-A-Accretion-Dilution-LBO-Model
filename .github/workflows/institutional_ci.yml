name: Valuation Model CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies & Quality Tools
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov flake8 mypy bandit numpy pandas scipy statsmodels

    - name: Run Linting (Flake8)
      run: |
        flake8 --count --select=E9,F63,F7,F82 --show-source --statistics || true

    - name: Run Type Checking (Mypy)
      run: |
        export PYTHONPATH=$PWD:$PWD/src
        mypy . --ignore-missing-imports || true

    - name: Run Valuation Model & Main Execution
      run: |
        # Append current directory and any nested subdirectories to PYTHONPATH
        export PYTHONPATH=$PWD:$(find $PWD -maxdepth 2 -type d | paste -sd ":" -)
        
        MAIN_FILE=$(find . -name "main.py" -print -quit)
        if [ -n "$MAIN_FILE" ]; then
          MAIN_DIR=$(dirname "$MAIN_FILE")
          cd "$MAIN_DIR"
          timeout 15 python main.py || true
        else
          echo "No main.py found, skipping execution."
        fi

    - name: Run Pytest Suite
      run: |
        # Ensure root and inner module paths are added before running pytest
        export PYTHONPATH=$PWD:$(find $PWD -maxdepth 2 -type d | paste -sd ":" -)
        
        TEST_DIR=$(find . -name "tests" -type d -print -quit)
        if [ -n "$TEST_DIR" ]; then
          PARENT_DIR=$(dirname "$TEST_DIR")
          cd "$PARENT_DIR"
          pytest -v --tb=short
        else
          echo "No tests directory found, skipping pytest safely."
        fi
