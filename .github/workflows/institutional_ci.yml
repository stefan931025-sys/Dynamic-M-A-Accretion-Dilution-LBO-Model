name: Valuation Model CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies & Quality Tools
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov flake8 mypy bandit numpy pandas scipy statsmodels

    - name: Run Linting (Flake8)
      run: |
        flake8 --count --select=E9,F63,F7,F82 --show-source --statistics || true

    - name: Run Type Checking (Mypy)
      run: |
        export PYTHONPATH=.
        mypy src --ignore-missing-imports || true

    - name: Run Valuation Model & Main Execution
      run: |
        export PYTHONPATH=.
        if [ -f "main.py" ]; then
          timeout 15 python main.py || true
        else
          echo "No root main.py found, skipping execution step."
        fi

    - name: Run Pytest Suite
      run: |
        export PYTHONPATH=.
        if [ -d "tests" ]; then 
          pytest -v --tb=short
        else 
          echo "No tests directory found, skipping unit tests safely."
        fi
